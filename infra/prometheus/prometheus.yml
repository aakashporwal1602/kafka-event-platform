# Prometheus scrape configuration.
# Baseline only — service targets and recording rules land in Chapter 12.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kafka-event-platform
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Kafka broker, topic and consumer-group metrics.
  # kafka-exporter speaks the Kafka protocol, so no JMX javaagent is needed —
  # a deliberate simplification for local development.
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
    metric_relabel_configs:
      # Drop per-partition series for internal topics: high cardinality, no value.
      - source_labels: [topic]
        regex: '__.*'
        action: drop

  # Platform services — registered as each one lands.
  - job_name: platform-services
    metrics_path: /metrics
    static_configs:
      - targets: []
        labels:
          component: platform
