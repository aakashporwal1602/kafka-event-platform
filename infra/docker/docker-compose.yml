# ============================================================================
#  Kafka Event Platform — local development stack
# ----------------------------------------------------------------------------
#  3-broker Kafka cluster in KRaft mode (ADR-0001) plus every dependency the
#  platform needs. Deliberately mirrors production topology so that failure
#  behaviour observed locally is representative:
#
#    RF=3 + min.insync.replicas=2  →  survives one broker loss with no data loss
#    3 controllers                 →  Raft quorum tolerates one controller loss
#
#  Local dev runs brokers in COMBINED mode (broker + controller in one process).
#  Production separates the roles onto dedicated controller nodes — see
#  infra/kubernetes/ (Chapter 16). This is the one intentional divergence.
# ============================================================================

name: kafka-event-platform

x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  restart: unless-stopped
  networks: [platform]
  healthcheck:
    test:
      [
        'CMD-SHELL',
        '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
      ]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env # --- KRaft: every node is both broker and controller (local only) ---------
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}

  # --- Listeners ------------------------------------------------------------
  # INTERNAL  → broker-to-broker and container-to-broker
  # EXTERNAL  → host machine (your laptop) to broker
  # CONTROLLER→ Raft quorum traffic only
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

  # --- Durability (N-3): acknowledged writes are never lost ------------------
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: 'false' # never elect an out-of-sync replica

  # --- Topic defaults --------------------------------------------------------
  KAFKA_NUM_PARTITIONS: 12 # see HLD §3 for the arithmetic
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false' # topics are provisioned declaratively
  KAFKA_LOG_RETENTION_HOURS: 168 # 7 days
  KAFKA_LOG_SEGMENT_BYTES: 268435456 # 256 MiB
  KAFKA_COMPRESSION_TYPE: producer # never re-compress; honour the producer's choice

  # --- Group coordination ----------------------------------------------------
  # 3s initial rebalance delay: lets a scaling deployment settle before the
  # group rebalances, avoiding a rebalance storm on rolling deploys.
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 6000
  KAFKA_GROUP_MAX_SESSION_TIMEOUT_MS: 300000

  # --- Resource limits -------------------------------------------------------
  KAFKA_MESSAGE_MAX_BYTES: 2097152 # 2 MiB — larger payloads use claim-check
  KAFKA_NUM_NETWORK_THREADS: 3
  KAFKA_NUM_IO_THREADS: 8
  KAFKA_HEAP_OPTS: -Xmx1G -Xms1G

services:
  # ==========================================================================
  #  Kafka brokers
  # ==========================================================================
  kafka-1:
    <<: *kafka-common
    container_name: kep-kafka-1
    ports: ['19092:19092']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes: ['kafka-1-data:/var/lib/kafka/data']

  kafka-2:
    <<: *kafka-common
    container_name: kep-kafka-2
    ports: ['19093:19093']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093
    volumes: ['kafka-2-data:/var/lib/kafka/data']

  kafka-3:
    <<: *kafka-common
    container_name: kep-kafka-3
    ports: ['19094:19094']
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094
    volumes: ['kafka-3-data:/var/lib/kafka/data']

  # ==========================================================================
  #  Kafka UI — topic browser, consumer group inspector, message viewer
  # ==========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kep-kafka-ui
    restart: unless-stopped
    ports: ['8080:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    networks: [platform]

  # ==========================================================================
  #  PostgreSQL — platform metadata (schemas, jobs, DLQ, audit, outbox)
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: kep-postgres
    restart: unless-stopped
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-event_platform}
      # Logical replication is required for Debezium CDC in Chapter 11.
      # Enabling it now avoids a disruptive restart later.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=8
        -c max_wal_senders=8
        -c shared_buffers=256MB
        -c max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-event_platform}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [platform]

  # ==========================================================================
  #  Redis — idempotency keys, distributed locks, rate limiting, caches
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: kep-redis
    restart: unless-stopped
    ports: ['6379:6379']
    # appendonly yes  → survives restart; idempotency keys must not vanish
    # allkeys-lru     → evict coldest keys under pressure rather than erroring
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [platform]

  # ==========================================================================
  #  Observability — wired properly in Chapter 12
  # ==========================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kep-kafka-exporter
    restart: unless-stopped
    ports: ['9308:9308']
    command:
      - --kafka.server=kafka-1:9092
      - --kafka.server=kafka-2:9092
      - --kafka.server=kafka-3:9092
      - --topic.filter=.*
      - --group.filter=.*
    depends_on:
      kafka-1: { condition: service_healthy }
    networks: [platform]

  prometheus:
    image: prom/prometheus:latest
    container_name: kep-prometheus
    restart: unless-stopped
    ports: ['9090:9090']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [platform]

  grafana:
    image: grafana/grafana:latest
    container_name: kep-grafana
    restart: unless-stopped
    ports: ['3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [platform]

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: kep-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    networks: [platform]

networks:
  platform:
    name: kep-network
    driver: bridge

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
